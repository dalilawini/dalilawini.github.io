name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The installer can't download the firmware straight from GitHub Releases
      # (no CORS headers), so ship a copy with the site. Public repo: no token needed.
      - name: Fetch firmware from the weather-app release
        env:
          WEATHER_APP_VERSION: v1.0.0
        run: |
          curl -fsSL -o src/assets/firmware/weather-monitoring/weather-app.bin "https://github.com/dalilawini/weather-app/releases/download/${WEATHER_APP_VERSION}/weather-app.bin"

      - run: npx ng build --configuration production --base-href /embedded-portfolio/

      - name: Locate build output and add SPA 404 fallback
        id: out
        run: |
          INDEX=$(find dist -name index.html -path '*browser*' | head -n 1)
          [ -z "$INDEX" ] && INDEX=$(find dist -name index.html | head -n 1)
          [ -z "$INDEX" ] && { echo "No index.html found in dist/"; exit 1; }
          DIR=$(dirname "$INDEX")
          cp "$DIR/index.html" "$DIR/404.html"
          touch "$DIR/.nojekyll"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Publishing $DIR"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
